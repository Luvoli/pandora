<style id="css">
/* Le monde à deux : nuit océane, aube corail, routes aériennes. */
:root{
  --sky1:#0d1030; --sky2:#2a1b4a; --sky3:#7a3b5e; --sky4:#e0866b;
  --ink:#f6efe6; --muted:#c3b6c4; --line:rgba(255,236,214,.14);
  --gold:#f2c46d; --gold2:#ffdf9e; --rose:#ff8fa3; --rose2:#e8607a;
  --glass:rgba(28,22,52,.58); --glass2:rgba(36,28,66,.66);
  --glow:rgba(242,196,109,.5);
  --display:"Cormorant Garamond","Georgia",serif; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--sky1)}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden;background:var(--sky1)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--sky3) 72%,var(--sky4) 100%)}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:34px 18px 60px;display:flex;flex-direction:column;gap:26px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}

/* En-tête */
header{display:flex;align-items:center;gap:28px}
header .txt{flex:1;min-width:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.kick{font:600 .78rem var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:28px;height:1px;background:var(--gold)}
h1{font-size:clamp(2.6rem,7vw,4.2rem);font-weight:600;line-height:.98;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff7ea 0%,var(--gold2) 45%,var(--gold) 70%,var(--rose) 115%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(242,196,109,.35))}
h1 em{font-style:italic;font-weight:500}
.lede{color:var(--muted);max-width:60ch;margin:14px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.ring{position:relative;width:150px;height:150px;flex:none;animation:rise 1s .15s cubic-bezier(.2,.8,.2,1) both}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .bgc{fill:none;stroke:rgba(255,255,255,.1);stroke-width:9}
.ring .fg{fill:none;stroke:url(#ringgrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--glow))}
.ring .ticks{fill:none;stroke:rgba(255,236,214,.25);stroke-width:1.5;stroke-dasharray:1 7.48}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font:600 2.6rem/1 var(--display);color:#fff7ea;text-shadow:0 0 14px var(--glow)}
.ring .mid span{font:600 .62rem var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ring::before{content:"";position:absolute;inset:-12px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);opacity:.3;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:scale(1.06)}}

/* Progression */
.progress{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.bar i{position:relative;display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--rose2),var(--gold),var(--gold2),var(--gold),var(--rose2));background-size:200% 100%;
  animation:flow 5s linear infinite;transition:width 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--glow)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:sheen 2.8s ease-in-out infinite}
@keyframes flow{to{background-position:-200% 0}}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.count{font:600 1.25rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--gold2)}

/* Astuces */
.tips{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 20px;position:relative;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tips::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--rose))}
.tips strong{font:600 1.25rem var(--display);color:var(--gold2)}
.tips ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;color:#e6dbe3}
.tips li::marker{color:var(--gold)}

/* Filtres */
.filters{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:5;padding:10px 0;margin:-10px 0}
.filters::before{content:"";position:absolute;inset:0 -18px;z-index:-1;background:linear-gradient(180deg,rgba(13,16,48,.85),rgba(13,16,48,.6) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
button{font:600 .9rem var(--body);color:var(--ink);cursor:pointer}
.filters button{padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--glass2);transition:background .2s,border-color .2s,box-shadow .2s,transform .15s}
.filters button:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(242,196,109,.3)}
.filters button:active{transform:scale(.96)}
.filters button[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#e9a65a);border-color:transparent;color:#2a1730;box-shadow:0 4px 18px rgba(242,196,109,.35)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Sections */
section{display:flex;flex-direction:column;gap:10px}
.sechead .fold{flex:none;align-self:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:inherit;font-size:15px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .2s;margin-right:-4px}
.sechead .fold:hover{background:rgba(255,255,255,.1)}
.sechead h2{cursor:pointer;flex:1;min-width:0}
.group.folded .sechead .fold{transform:rotate(-90deg)}
.group.folded > :not(.sechead){display:none}
.group.folded{padding-bottom:4px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line);position:relative}
.sechead::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:2px}
h2{font-size:1.75rem;font-weight:600;color:#fff4e4;line-height:1.1}
.sechead .right{display:flex;align-items:center;gap:10px}
.sechead small{font:600 1.05rem var(--display);color:var(--gold2);font-variant-numeric:tabular-nums}
.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:.78rem;color:var(--muted);transition:color .2s,border-color .2s,background .2s}
.ghost:hover{color:var(--rose);border-color:var(--rose);background:rgba(255,143,163,.08)}
.ghost.restore:hover{color:var(--gold2);border-color:var(--gold);background:rgba(242,196,109,.08)}

ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.item{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px 10px 13px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .25s}
li.item::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--rose));opacity:0;transition:opacity .25s}
li.item:hover{transform:translateY(-2px);border-color:rgba(242,196,109,.45);background:var(--glass2);box-shadow:0 12px 30px -10px rgba(0,0,0,.6),0 0 24px -6px rgba(242,196,109,.35)}
li.item:hover::before{opacity:1}
body:not(.ready) li.item{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
li.item.done{background:linear-gradient(100deg,rgba(242,196,109,.12),var(--glass) 55%)}
li.item.done .name,li.item.done .note{opacity:.6}
li.item.done .name{text-decoration:line-through;text-decoration-color:var(--gold);text-decoration-thickness:1.5px}

li.item input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:1px 0 0;border-radius:50%;cursor:pointer;
  border:1.5px solid rgba(255,236,214,.45);background:rgba(0,0,0,.2);display:grid;place-items:center;position:relative;transition:border-color .2s,box-shadow .2s,background .2s}
li.item input:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(242,196,109,.5)}
li.item input::after{content:"";width:6px;height:11px;border:solid #2a1730;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .2s}
li.item input:checked{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#e9a65a);border-color:transparent;box-shadow:0 0 14px var(--glow)}
li.item input:checked::after{transform:rotate(45deg) scale(1)}
li.item input.just{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
li.item input.just::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--gold);animation:burst .6s ease-out forwards}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes burst{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}

.name{font-weight:600;cursor:pointer;font-size:1.02rem}
.note{grid-column:2 / -1;padding-right:6px;color:var(--muted);font-size:.93rem}
.tags{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tag{font:600 .72rem var(--body);letter-spacing:.03em;padding:2px 9px;border-radius:99px;border:1px solid}
.tag.free{background:rgba(242,196,109,.12);color:var(--gold2);border-color:rgba(242,196,109,.35)}
.tag.pay{background:rgba(255,143,163,.1);color:var(--rose);border-color:rgba(255,143,163,.32)}
.tag.out{background:rgba(160,170,255,.1);color:#b9c0ff;border-color:rgba(160,170,255,.32)}
li.item:hover .tag{box-shadow:0 0 10px -2px currentColor}
.x{background:none;border:none;color:var(--muted);font-size:1.2rem;line-height:1;padding:3px 7px;border-radius:8px;transition:color .2s,background .2s,transform .2s}
.x:hover{color:var(--rose);background:rgba(255,143,163,.12);transform:rotate(90deg)}
.empty{color:var(--muted);font-style:italic;margin:0}
.removed{border-top:1px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.removed ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.removed li{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.03)}
footer{color:var(--muted);font-size:.85rem;text-align:center}

@media(max-width:640px){
  header{flex-direction:column-reverse;align-items:flex-start;gap:14px}
  .ring{width:108px;height:108px}
  .ring .mid b{font-size:1.9rem}
  .ring .mid span{font-size:.55rem}
  li.item:hover{transform:none}
  .progress{padding:12px 14px}
  
}
@media(prefers-reduced-motion:reduce){#fx *{animation:none!important}#fx .plane,#fx .cloud{display:none}#fx .earth svg *{animation:none}*{animation-duration:.01s!important;transition:none!important}}
:root{
  --sky1:#040a1a; --sky2:#081d3a; --sky3:#0d4458; --sky4:#e98a72;
  --ink:#edf7f8; --muted:#a3b9c6; --line:rgba(190,240,255,.14);
  --gold:#6ff0d2; --gold2:#c9fff2; --rose:#ff9a85; --rose2:#ef6f6f;
  --glass:rgba(8,24,46,.6); --glass2:rgba(12,34,62,.72); --glow:rgba(111,240,210,.45);
  --display:"Fraunces","Georgia",serif;
  --accent:#6ff0d2;--accent2:#c9fff2;--accent3:#ff9a85;--accent-deep:#2fc3a6;--onaccent:#03231d;--sheet:rgba(9,27,50,.95);--sheet-solid:#0a1f38;
}
#fx{background:radial-gradient(120% 70% at 50% 108%,rgba(255,170,130,.55),transparent 55%),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 40%,var(--sky3) 78%,#2b6a73 92%,#c98572 100%)}
h1{font-weight:600;letter-spacing:-.02em;background:linear-gradient(180deg,#f3fffc 0%,var(--gold2) 40%,var(--gold) 72%,var(--rose) 118%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 24px rgba(111,240,210,.3))}
h1 em{font-weight:500}
.ring .mid b{color:#f3fffc}
.filters button[aria-pressed="true"]{color:var(--onaccent);background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--accent-deep))}
li.item input::after{border-color:var(--onaccent)}
li.item.done{background:linear-gradient(100deg,rgba(111,240,210,.12),var(--glass) 55%)}
.filters::before{background:linear-gradient(180deg,rgba(4,10,26,.9),rgba(4,10,26,.65) 70%,transparent)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stat{font:500 .85rem var(--body);color:var(--muted);padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.stat b{font:600 1.05rem var(--display);color:var(--gold2)}

/* Barre de filtres : pays + état */
.filterbar{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:2px;padding:4px 0;margin:-4px 0}
.filterbar::before{content:"";position:absolute;inset:-6px -18px -14px;z-index:-1;opacity:0;transition:opacity .25s;background:linear-gradient(180deg,rgba(4,10,26,.92),rgba(4,10,26,.75) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.filterbar.stuck::before{opacity:1}
.filterbar .filters{position:static;padding:6px 10px 8px;margin:0 -10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.filterbar .filters button:focus{outline:none}
.filterbar .filters button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.filterbar .filters button[aria-pressed="true"]{box-shadow:0 2px 10px rgba(242,196,109,.28)}
.filterbar .filters::-webkit-scrollbar{display:none}
.filterbar .filters::before{display:none}
.filterbar .filters button{white-space:nowrap;flex:none}
.filters.small button{padding:5px 12px;font-size:.8rem}

/* Zones */
#list{display:flex;flex-direction:column;gap:18px}
.zone{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin:22px 0 2px;padding-bottom:4px}
.zone:first-child{margin-top:4px}
.zone .zt{font:600 1.05rem var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.zone.maybe .zt{color:#b9c3ff}
.zone .zs{color:var(--muted);font-size:.9rem}
.zone::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);min-width:40px;align-self:center}

/* Pays : carte façon tampon de passeport */
section.group{padding:16px 16px 14px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);position:relative;overflow:hidden}
section.group::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:2px dashed rgba(111,240,210,.12);pointer-events:none}
section.group.st-maybe{background:linear-gradient(160deg,rgba(185,195,255,.05),rgba(255,255,255,.01))}
section.group.st-maybe::before{border-color:rgba(185,195,255,.12)}
section.group .sechead{border-bottom:none;padding-bottom:0}
section.group .sechead::after{display:none}
section.group h2{display:flex;align-items:center;gap:12px;font-size:2rem}
.flag{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;font-size:1.9rem;line-height:1;flex:none;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid var(--line);box-shadow:0 0 0 4px rgba(255,255,255,.03),0 8px 22px -8px rgba(0,0,0,.6)}
.sechead .right{flex-wrap:wrap;justify-content:flex-end}
.pill{border-radius:99px;padding:5px 12px;font-size:.8rem;border:1px solid;transition:filter .2s,transform .15s}
.pill.prio{color:var(--gold2);border-color:rgba(111,240,210,.45);background:rgba(111,240,210,.12)}
.pill.maybe{color:#cfd5ff;border-color:rgba(185,195,255,.4);background:rgba(185,195,255,.1)}
.pill:hover{filter:brightness(1.25)}.pill:active{transform:scale(.95)}
.ghost.mv{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:.95rem}
.gbar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 0 4px}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--glow)}
section.group .addhere{margin-top:2px}

/* Étiquettes */
.tag{background:rgba(255,255,255,.06);color:#d6e6ee;border-color:rgba(255,255,255,.18)}
.tag.place{background:rgba(255,154,133,.12);color:#ffc2b4;border-color:rgba(255,154,133,.35)}
.tag.vue{background:rgba(111,240,210,.1);color:#aef8e6;border-color:rgba(111,240,210,.35)}
.tag.visite{background:rgba(185,195,255,.1);color:#cfd5ff;border-color:rgba(185,195,255,.35)}
.tag.parc{background:rgba(255,214,102,.1);color:#ffe299;border-color:rgba(255,214,102,.35)}
.tag.bienetre{background:rgba(255,160,210,.1);color:#ffc1e1;border-color:rgba(255,160,210,.35)}
.tag.food{background:rgba(255,180,120,.1);color:#ffd0a8;border-color:rgba(255,180,120,.35)}
.tag.nature{background:rgba(140,230,140,.1);color:#bff3bf;border-color:rgba(140,230,140,.35)}
.tag.transport{background:rgba(120,200,255,.1);color:#b8e2ff;border-color:rgba(120,200,255,.35)}
.tag.shop{background:rgba(220,170,255,.1);color:#e6caff;border-color:rgba(220,170,255,.35)}
.tag.exp{background:rgba(255,240,170,.1);color:#fff1b8;border-color:rgba(255,240,170,.35)}

/* Décor : ciel du soir, vraie Terre, horizon de lieux du monde, mer */
#fx .star{position:absolute;border-radius:50%;background:#f1fbff;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.85}}
#fx .earth{position:absolute;right:6vw;top:10vh;width:min(36vmin,380px);height:min(36vmin,380px);filter:drop-shadow(0 0 40px rgba(111,240,210,.18))}
#fx .earth svg{width:100%;height:100%;overflow:visible}
#fx .cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(220,240,255,.13),transparent);filter:blur(6px);animation:drift var(--d) linear var(--dl) infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#fx .sun{position:absolute;left:50%;bottom:9vh;width:60vmin;height:34vmin;margin-left:-30vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,150,.55),rgba(255,140,110,.16) 55%,transparent);animation:breathe 7s ease-in-out infinite}
#fx .skyline{position:absolute;left:0;right:0;bottom:11vh;height:24vh}
#fx .skyline svg,#fx .refl svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
#fx .skyline .blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
#fx .win{animation:win var(--d) ease-in-out var(--dl) infinite}
@keyframes win{0%,100%{opacity:.9}45%{opacity:.9}50%{opacity:.25}55%{opacity:.9}}
#fx .sea{position:absolute;left:0;right:0;bottom:0;height:11vh;overflow:hidden;background:linear-gradient(180deg,#1b4a5e,#0c2c44 45%,#061a2e)}
#fx .refl{position:absolute;left:0;right:0;top:0;height:24vh;transform:scaleY(-1);transform-origin:top;opacity:.22;filter:blur(1.5px);-webkit-mask:linear-gradient(0deg,#000,transparent 45%);mask:linear-gradient(0deg,#000,transparent 45%)}
#fx .glint{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,210,180,.7),transparent);animation:glint var(--d) ease-in-out var(--dl) infinite}
@keyframes glint{0%,100%{opacity:0;transform:scaleX(.4)}50%{opacity:.9;transform:scaleX(1)}}
#fx .plane{position:absolute;left:0;width:70px;height:2px;animation:fly var(--d) linear var(--dl) infinite}
#fx .plane::before{content:"";position:absolute;right:0;top:-1px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:blink 1.2s steps(1) infinite}
#fx .plane::after{content:"";position:absolute;right:5px;top:0;width:64px;height:1px;background:linear-gradient(90deg,transparent,rgba(220,245,255,.35))}
@keyframes fly{from{transform:translate(-10vw,0) rotate(var(--r))}to{transform:translate(110vw,var(--dy)) rotate(var(--r))}}
@media(max-width:640px){
  #fx .earth{right:-8vmin;top:3vh;width:46vmin;height:46vmin;opacity:.55}
  #fx .skyline{height:18vh}
  #fx .refl{height:18vh}
  section.group{padding:14px 12px 12px}
  section.group h2{font-size:1.6rem}
  .flag{width:44px;height:44px;font-size:1.6rem}
  .sechead .right{justify-content:flex-start}
}

.flag.img{padding:0;overflow:hidden;background:none}.flag.img img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.emo.img{display:inline-flex;vertical-align:-3px;margin-right:6px}.emo.img img{width:1.15em;height:1.15em;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.fpick{position:relative}
.ftrig{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;cursor:pointer}
.ftrig:hover,.ftrig[aria-expanded="true"]{border-color:var(--accent,#fff)}
.fprev{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.fprev img{width:100%;height:100%;object-fit:cover;display:block}.fprev.empty{color:var(--muted);font-size:.9rem;background:rgba(255,255,255,.06)}
.fname{flex:1;min-width:0}.fname.muted{color:var(--muted)}.fcar{color:var(--muted);font-size:.8rem}
.fpop{position:static;margin-top:6px;background:var(--sheet-solid,#111);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.fq{width:100%;box-sizing:border-box;margin-bottom:6px}
.flist{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.fopt{display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fopt:hover,.fopt:focus-visible,.fopt.on{background:rgba(255,255,255,.08)}.fopt[hidden]{display:none}
.fopt img{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.flag,.emo,.flagin,.flagsel{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.emo{margin-right:.35em}
.tag.price{background:rgba(255,214,102,.08);color:#ffe7a6;border-color:rgba(255,214,102,.3);font-variant-numeric:tabular-nums}
.tag.done-trip{background:rgba(111,240,210,.08);color:#aef8e6;border-color:rgba(111,240,210,.3)}

/* ===== Composants communs : ajout, édition, sauvegarde ===== */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .sp{flex:1}
.primary,.cta{font:600 .95rem var(--body);border:none;border-radius:99px;padding:10px 18px;color:var(--onaccent);cursor:pointer;
  background:linear-gradient(135deg,var(--accent2),var(--accent) 55%,var(--accent-deep));box-shadow:0 6px 22px -6px var(--glow);transition:transform .15s,box-shadow .2s,filter .2s}
.primary:hover,.cta:hover{filter:brightness(1.06);box-shadow:0 8px 28px -6px var(--glow)}
.primary:active,.cta:active{transform:scale(.97)}
.cta.alt{background:var(--glass2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.cta.alt:hover{border-color:var(--accent)}
#savestate{font:600 .74rem var(--body);letter-spacing:.04em;color:var(--muted);display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
#savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:#7bd88f;box-shadow:0 0 8px #7bd88f}
#savestate[data-mode="saving"]::before,#savestate[data-mode="pending"]::before{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1s infinite}
#savestate[data-mode="local"]::before{background:#9aa3c7;box-shadow:none}
#savestate[data-mode="readonly"]::before{background:var(--accent3);box-shadow:none}
@keyframes blink{50%{opacity:.3}}

.acts{display:flex;gap:2px;align-items:center}
.x.edit{font-size:1rem;opacity:.55;transition:opacity .2s,color .2s,background .2s}
li.item:hover .x.edit,.x.edit:focus-visible{opacity:1}
.x.edit:hover{color:var(--accent2);background:rgba(255,255,255,.08);transform:none}
.addhere{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:99px;padding:6px 14px;color:var(--muted);font:600 .84rem var(--body);transition:color .2s,border-color .2s,background .2s}
.addhere:hover{color:var(--accent2);border-color:var(--accent);background:rgba(255,255,255,.04)}
.ghost.danger:hover{color:var(--accent3);border-color:var(--accent3)}
.ghost:disabled{opacity:.3;cursor:default;pointer-events:none}
.rbtns{display:flex;gap:6px}
li.item.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 2px var(--accent),0 0 30px var(--glow)}100%{box-shadow:0 0 0 0 transparent}}
section.moved{animation:fresh 1.6s ease-out;border-radius:14px}
.empty.big{text-align:center;padding:30px 0}

/* Fenêtre */
body.modal-open{overflow:hidden}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .backdrop{position:absolute;inset:0;background:rgba(5,6,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.modal.on .backdrop{opacity:1}
.sheet{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:20px;padding:22px 22px 18px;background:var(--sheet);border:1px solid var(--line);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04) inset;transform:translateY(14px) scale(.98);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
.modal.on .sheet{transform:none;opacity:1}
.sheet h3{margin:0 0 14px;font:600 1.6rem/1.1 var(--display);color:var(--accent2)}
.fields{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.short input{max-width:110px;font-size:1.3rem;text-align:center}
.fl{font:600 .74rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet input,.sheet select,.sheet textarea{font:400 1rem var(--body);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
.sheet textarea{resize:vertical;min-height:70px}
.sheet select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.sheet select option{background:var(--sheet-solid);color:var(--ink)}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 18px -4px var(--glow)}
.newg{display:flex;gap:10px;flex-wrap:wrap;padding:12px;border-radius:14px;border:1px dashed var(--line);background:rgba(255,255,255,.03)}
.newg .fld:first-child{flex:1;min-width:180px}
.tagpick{display:flex;flex-wrap:wrap;gap:7px}
.tagpick .tag{cursor:pointer;font-size:.8rem;padding:5px 12px;opacity:.55;transition:opacity .2s,transform .15s,box-shadow .2s}
.tagpick .tag[aria-pressed="true"]{opacity:1;box-shadow:0 0 12px -2px currentColor}
.tagpick .tag:active{transform:scale(.95)}
.merr{color:var(--accent3);font-size:.9rem;margin:10px 0 0;min-height:1em}
.merr:empty{display:none}
.mbtns{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.mbtns .sp{flex:1}
.mbtns .ghost{padding:9px 15px;font-size:.88rem}

.toast{position:fixed;left:50%;bottom:22px;z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:99px;

/* Drapeaux en images (flag-icons, MIT, hébergé dans vendor/flags) : l'emoji sert juste de clé */
const FLAG_FILES = new Set(["ad", "ae", "af", "ag", "ai", "al", "am", "ao", "aq", "ar", "arab", "as", "asean", "at", "au", "aw", "ax", "az", "ba", "bb", "bd", "be", "bf", "bg", "bh", "bi", "bj", "bl", "bm", "bn", "bo", "bq", "br", "bs", "bt", "bv", "bw", "by", "bz", "ca", "cc", "cd", "cefta", "cf", "cg", "ch", "ci", "ck", "cl", "cm", "cn", "co", "cp", "cr", "cu", "cv", "cw", "cx", "cy", "cz", "de", "dg", "dj", "dk", "dm", "do", "dz", "eac", "ec", "ee", "eg", "eh", "er", "es", "es-ct", "es-ga", "es-pv", "et", "eu", "fi", "fj", "fk", "fm", "fo", "fr", "ga", "gb", "gb-eng", "gb-nir", "gb-sct", "gb-wls", "gd", "ge", "gf", "gg", "gh", "gi", "gl", "gm", "gn", "gp", "gq", "gr", "gs", "gt", "gu", "gw", "gy", "hk", "hm", "hn", "hr", "ht", "hu", "ic", "id", "ie", "il", "im", "in", "io", "iq", "ir", "is", "it", "je", "jm", "jo", "jp", "ke", "kg", "kh", "ki", "km", "kn", "kp", "kr", "kw", "ky", "kz", "la", "lb", "lc", "li", "lk", "lr", "ls", "lt", "lu", "lv", "ly", "ma", "mc", "md", "me", "mf", "mg", "mh", "mk", "ml", "mm", "mn", "mo", "mp", "mq", "mr", "ms", "mt", "mu", "mv", "mw", "mx", "my", "mz", "na", "nc", "ne", "nf", "ng", "ni", "nl", "no", "np", "nr", "nu", "nz", "om", "pa", "pc", "pe", "pf", "pg", "ph", "pk", "pl", "pm", "pn", "pr", "ps", "pt", "pw", "py", "qa", "re", "ro", "rs", "ru", "rw", "sa", "sb", "sc", "sd", "se", "sg", "sh", "sh-ac", "sh-hl", "sh-ta", "si", "sj", "sk", "sl", "sm", "sn", "so", "sr", "ss", "st", "sv", "sx", "sy", "sz", "tc", "td", "tf", "tg", "th", "tj", "tk", "tl", "tm", "tn", "to", "tr", "tt", "tv", "tw", "tz", "ua", "ug", "um", "un", "us", "uy", "uz", "va", "vc", "ve", "vg", "vi", "vn", "vu", "wf", "ws", "xk", "xx", "ye", "yt", "za", "zm", "zw"]);
function flagCode(f){
  f = (f || "").trim(); if (!f) return "";
  const cps = Array.from(f).map(c => c.codePointAt(0));
  if (cps[0] === 0x1F3F4 && cps.length > 2) { const tag = cps.slice(1, -1).map(c => String.fromCharCode(c - 0xE0000)).join(""); const m = { gbeng:"gb-eng", gbsct:"gb-sct", gbwls:"gb-wls" }[tag]; return m && FLAG_FILES.has(m) ? m : ""; }
  if (cps.length === 2 && cps.every(c => c >= 0x1F1E6 && c <= 0x1F1FF)) { const c = String.fromCharCode(cps[0] - 0x1F1E6 + 97, cps[1] - 0x1F1E6 + 97); return FLAG_FILES.has(c) ? c : ""; }
  return "";
}
function flagNode(f, cls){
  const s = el("span", cls); const c = flagCode(f);
  if (c) { const i = document.createElement("img"); i.src = "vendor/flags/1x1/" + c + ".svg"; i.alt = ""; i.decoding = "async"; s.appendChild(i); s.classList.add("img"); }
  else s.textContent = f || "";
  return s;
}

/* Drapeau : rempli tout seul d'après le nom (pays ou ville), ou choisi dans une liste avec aperçu */
function flagField(parent, initial, nameInput){
  const FL = window.__flags || { regions: [], of: () => "" };
  const norm = x => (x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  const w = el("div", "fld"); w.appendChild(el("span", "fl", "Drapeau"));
  const wrap = el("div", "fpick");
  const fi = el("input"); fi.type = "hidden"; fi.className = "flagin"; fi.value = initial || "";
  const trig = btn("ftrig", ""); trig.setAttribute("aria-haspopup", "listbox"); trig.setAttribute("aria-expanded", "false");
  const pop = el("div", "fpop"); pop.hidden = true;
  const q = el("input"); q.type = "search"; q.placeholder = "Chercher un pays…"; q.className = "fq"; q.setAttribute("aria-label", "Chercher un pays");
  const list = el("div", "flist"); list.setAttribute("role", "listbox");
  pop.appendChild(q); pop.appendChild(list);
  wrap.appendChild(fi); wrap.appendChild(trig); wrap.appendChild(pop); w.appendChild(wrap); parent.appendChild(w);
  const nameOf = f => { const c = flagCode(f); const r = FL.regions.find(r => r.c.toLowerCase() === c.slice(0, 2) && !c.includes("-")); return c === "gb-eng" ? "Angleterre" : c === "gb-sct" ? "Écosse" : c === "gb-wls" ? "Pays de Galles" : r ? r.fr : ""; };
  const paint = () => { trig.innerHTML = ""; if (fi.value) { trig.appendChild(flagNode(fi.value, "fprev")); trig.appendChild(el("span", "fname", nameOf(fi.value) || "Drapeau choisi")); } else { trig.appendChild(el("span", "fprev empty", "?")); trig.appendChild(el("span", "fname muted", "Choisir un drapeau")); } trig.appendChild(el("span", "fcar", "▾")); };
  let built = false;
  const build = () => { if (built) return; built = true;
    const items = FL.regions.filter(r => FLAG_FILES.has(r.c.toLowerCase())).map(r => ({ c:r.c.toLowerCase(), f:FL.of(r.c), n:r.fr, k:norm(r.fr + " " + (r.en || "")) }));
    [["gb-eng","Angleterre","england"],["gb-sct","Écosse","scotland"],["gb-wls","Pays de Galles","wales"]].forEach(([c,n,en]) => { const tag = c.replace("-", ""); items.push({ c, f:"\u{1F3F4}" + Array.from(tag).map(ch => String.fromCodePoint(0xE0000 + ch.charCodeAt(0))).join("") + "\u{E007F}", n, k:norm(n + " " + en) }); });
    items.sort((a, b) => a.n.localeCompare(b.n, "fr"));
    items.forEach(it => { const o = btn("fopt", ""); o.setAttribute("role", "option"); o.dataset.k = it.k; o.dataset.f = it.f;
      const i = document.createElement("img"); i.src = "vendor/flags/1x1/" + it.c + ".svg"; i.alt = ""; i.loading = "lazy"; o.appendChild(i); o.appendChild(el("span", null, it.n)); list.appendChild(o); }); };
  const filter = () => { const t = norm(q.value); list.querySelectorAll(".fopt").forEach(o => o.hidden = !!t && !o.dataset.k.includes(t)); };
  const open = v => { if (v) build(); pop.hidden = !v; trig.setAttribute("aria-expanded", v ? "true" : "false"); if (v) { q.value = ""; filter(); setTimeout(() => q.focus(), 30); const cur = list.querySelector('.fopt[data-f="' + CSS.escape(fi.value) + '"]'); list.querySelectorAll(".fopt.on").forEach(o => o.classList.remove("on")); if (cur) { cur.classList.add("on"); cur.scrollIntoView({ block:"center" }); } } };
  trig.addEventListener("click", () => open(pop.hidden));
  q.addEventListener("input", filter);
  q.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); open(false); trig.focus(); } if (e.key === "Enter") { e.preventDefault(); const f = [...list.querySelectorAll(".fopt")].find(o => !o.hidden); if (f) f.click(); } });
  list.addEventListener("click", e => { const o = e.target.closest(".fopt"); if (!o) return; fi.value = o.dataset.f; auto = false; paint(); open(false); trig.focus(); });
  document.addEventListener("click", e => { if (!pop.hidden && !wrap.contains(e.target)) open(false); });
  // automatique tant que le drapeau est vide ou qu'il vient de la devinette
  let auto = !initial || initial === C.guessFlag(nameInput.value);
  nameInput.addEventListener("input", () => { if (auto) { fi.value = C.guessFlag(nameInput.value) || ""; paint(); } });
  if (!initial && auto) fi.value = C.guessFlag(nameInput.value) || "";
  paint();
  return fi;
}

function openGroupModal(g){
  const refs = {};
  openSheet(g ? "Modifier " + C.groupWordArt : C.addGroupTitle, f => {
    refs.t = inp("text", g ? g.t : "", C.newGroupPh); refs.t.maxLength = 60; field(f, "Nom", refs.t);
    if (C.flags) { refs.fl = flagField(f, g ? g.flag : "", refs.t); }
    if (C.status) { refs.st = el("select"); [["prio","★ Priorité"],["maybe","☾ Un jour, peut-être"]].forEach(([v,l]) => { const o = el("option", null, l); o.value = v; refs.st.appendChild(o); }); refs.st.value = g ? g.status : "prio"; field(f, "Statut", refs.st); }
  }, () => {
    const t = refs.t.value.trim(); if (!t) { refs.t.focus(); return "Donne un nom."; }
    const flag = refs.fl ? refs.fl.value.trim() : "";
    if (g) { if (g.builtin) state.gedits[g.id] = { t, flag }; else Object.assign(state.customGroups.find(x => x.id === g.id), { t, flag }); if (refs.st) state.status[g.id] = refs.st.value; commit(); toast("Modifié."); return; }
    const ex = groups().find(x => x.t.toLowerCase() === t.toLowerCase());
    if (ex) { if (state.removedGroups[ex.id]) { delete state.removedGroups[ex.id]; commit(); toast("« " + ex.t + " » remis dans la liste."); return; } return "« " + ex.t + " » existe déjà."; }
    const id = uid("g"); state.customGroups.push({ id, t, flag }); if (refs.st) state.status[id] = refs.st.value;
    commit(); toast("Ajouté !");
    requestAnimationFrame(() => { const n = document.querySelector('section[data-g="' + id + '"]'); if (n) { n.classList.add("moved"); n.scrollIntoView({ block:"center", behavior:"smooth" }); } });
  }, g ? () => { state.removedGroups[g.id] = 1; commit(); } : null);
}

/* ---------- Démarrage ---------- */
function start(){
  const tpl = document.getElementById("markup");
  document.body.insertBefore(tpl.content.cloneNode(true), tpl);
  const keep = SS.get(C.localKey + "-keep");
  const reloaded = keep && Date.now() - keep.t < 20000;
  if (reloaded) document.body.classList.add("ready", "noanim");
  $("#addBtn").addEventListener("click", () => openItemModal(null));
  const ag = $("#addGroupBtn"); if (ag) ag.addEventListener("click", () => openGroupModal(null));
  if (C.decor) C.decor();
  render(); setBadge();
  if (reloaded) { requestAnimationFrame(() => scrollTo(0, keep.y)); SS.set(C.localKey + "-keep", null); }
  else setTimeout(() => document.body.classList.add("ready"), 1400);
  $("#expBtn").addEventListener("click", exportState);
  $("#impBtn").addEventListener("click", openImport);
  $("#logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.replace("./"); });
  connectDB();
}
window.__app = { get state(){ return state; }, render, groups, allItems, publishNow };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
