<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050913;color:#e8f4f6;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(36px + env(safe-area-inset-top)) 18px 40px;position:relative;overflow-x:hidden;
  background:radial-gradient(80% 55% at 50% -12%,rgba(64,120,255,.22),transparent 62%),radial-gradient(60% 45% at 8% 105%,rgba(31,209,193,.16),transparent 65%),radial-gradient(55% 40% at 95% 100%,rgba(140,80,255,.16),transparent 65%),#050913}
body>*:not(#sky){position:relative;z-index:1}
/* Forêt bioluminescente : spores qui flottent, silhouettes au loin */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky .spore{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#e9fffb 0%,var(--c) 35%,transparent 70%);opacity:0;filter:blur(.3px);
  animation:drift var(--d) linear var(--dl) infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}10%{opacity:var(--o)}50%{transform:translate(var(--dx),-55vh)}90%{opacity:var(--o)}100%{transform:translate(calc(var(--dx)*-.6),-110vh);opacity:0}}
#sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh;min-height:200px}
#sky .glow{animation:pulse var(--d,5s) ease-in-out var(--dl,0s) infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){#sky .spore,#sky .glow{animation:none}#sky .spore{opacity:.4;bottom:auto}}
.nmduo:not(:empty)::before{content:" · "}
.duo{font:600 12px/1 Inter,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#7fb8c2;margin-bottom:10px;text-align:center}
h1{font:400 clamp(44px,8vw,76px)/.9 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em;margin:0 0 34px;text-align:center;
  background:linear-gradient(180deg,#f2fffd 0%,#9ff6ec 45%,#6fb6ff 80%,#a98bff 110%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(80,230,220,.35))}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;width:min(1040px,100%)}
@media(max-width:760px){.grid{grid-template-columns:1fr;gap:16px;max-width:440px}}
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:18px;outline:none;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.poster{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:3px solid transparent;transition:border-color .2s,box-shadow .28s;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
.deco.wide{display:none}
@media(max-width:760px){.poster{aspect-ratio:2/1}.deco.tall{display:none}.deco.wide{display:block}
  .ttl{left:16px;bottom:14px;right:auto;max-width:62%}.ttl small{margin-top:4px}
  .wl .ttl b{font-size:46px}.pa .ttl b,.mo .ttl b{font-size:34px;line-height:1}}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.03)}
.card:hover .poster,.card:focus-visible .poster{border-color:#9ff6ec;box-shadow:0 26px 60px -20px rgba(0,0,0,.95),0 0 32px -4px rgba(80,230,220,.45)}
.poster svg.deco{position:absolute;inset:0;width:100%;height:100%}
.ttl{position:absolute;left:18px;right:18px;bottom:18px}
.ttl b{display:block}
.ttl small{display:block;margin-top:6px;font:600 11px/1.2 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
/* Watchlist */
.wl .poster{background:#f3eee4}
.wl .ttl b{font:400 clamp(52px,6vw,68px)/.85 "Bebas Neue",Impact,sans-serif;color:#171412;letter-spacing:.01em}
.wl .ttl small{color:#c8102e;opacity:1}
.wl .ttl{bottom:52px}
@media(max-width:760px){.wl .ttl{bottom:34px}}
/* Paris */
.pa .poster{background:linear-gradient(180deg,#0d1030 0%,#2a1b4a 40%,#7a3b5e 75%,#e0866b 100%)}
.pa .ttl b{font:600 clamp(40px,4.6vw,52px)/.95 "Cormorant Garamond",Georgia,serif;background:linear-gradient(180deg,#fff7ea,#ffdf9e 45%,#f2c46d 70%,#ff8fa3 115%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pa .ttl b em{font-style:italic;font-weight:500}
.pa .ttl small{color:#f2c46d}
/* Monde */
.mo .poster{background:radial-gradient(120% 70% at 50% 110%,rgba(255,170,130,.6),transparent 55%),linear-gradient(180deg,#040a1a 0%,#081d3a 40%,#0d4458 80%,#2b6a73 100%)}
.mo .ttl b{font:600 clamp(40px,4.6vw,52px)/.95 Fraunces,Georgia,serif;letter-spacing:-.02em;background:linear-gradient(180deg,#f3fffc,#c9fff2 40%,#6ff0d2 72%,#ff9a85 118%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mo .ttl b em{font-weight:500}
.mo .ttl small{color:#6ff0d2}
/* progression */
.prog{margin-top:12px;padding:0 4px}
.prog .bar{height:5px;border-radius:99px;background:rgba(160,230,240,.12);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.wl .prog i{background:#e2384f}.pa .prog i{background:linear-gradient(90deg,#e8607a,#f2c46d)}.mo .prog i{background:linear-gradient(90deg,#6ff0d2,#ff9a85)}
.prog p{margin:7px 0 0;font-size:13px;color:#9fb9c0;display:flex;justify-content:space-between;gap:10px}
.prog p b{color:#e8f4f6;font-weight:600}
.foot{margin-top:38px;display:flex;gap:18px;align-items:center;color:#6f8f97;font-size:13px;flex-wrap:wrap;justify-content:center}
.foot button{background:none;border:0;color:#8fb3bb;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.foot button:hover{color:#e8f4f6}
/* connexion */
#auth{width:min(400px,100%);background:rgba(10,22,34,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 40px -10px rgba(80,230,220,.25);border:1px solid rgba(120,220,230,.18);border-radius:20px;padding:24px 22px}
#auth[hidden],.grid[hidden],.foot[hidden]{display:none}
#auth h2{font:400 34px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.03em;margin:0 0 4px}
#auth p{margin:0 0 18px;color:#8fb3bb;font-size:14px}
#auth label{display:block;margin-bottom:14px}
#auth label span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8fb3bb;font-weight:700;margin-bottom:6px}
#auth input{width:100%;background:rgba(3,10,18,.8);border:1.5px solid rgba(120,220,230,.22);border-radius:12px;padding:11px 12px;color:#f2ede6;font:16px Inter,sans-serif;outline:none}
#auth input:focus{border-color:#5fe3d6;box-shadow:0 0 14px -2px rgba(80,230,220,.4)}
#auth .err{color:#ff6b7f;font-weight:600;font-size:13.5px;min-height:18px;margin:2px 0 10px}
#auth button{width:100%;border:0;border-radius:999px;background:linear-gradient(90deg,#1fc8bb,#6b7bff);color:#02141a;box-shadow:0 6px 22px -6px rgba(80,230,220,.6);font:700 15px Inter,sans-serif;padding:12px;cursor:pointer}
#auth button:disabled{opacity:.6}
#auth .ts{margin:0 0 6px;min-height:0}
</style>

<script>
/* spores lumineuses (légères : 16 sur ordi, 9 sur téléphone) */
(() => { const sky=document.getElementById('sky'), R=Math.random, cols=['rgba(95,227,214,.9)','rgba(120,170,255,.85)','rgba(177,139,255,.85)'];
  const n=innerWidth<640?9:16;
  for(let i=0;i<n;i++){ const s=document.createElement('span'), z=3+R()*5; s.className='spore';
    s.style.cssText=`left:${R()*100}%;width:${z}px;height:${z}px;--c:${cols[i%3]};--o:${(.35+R()*.45).toFixed(2)};--d:${(18+R()*20).toFixed(1)}s;--dl:${(-R()*36).toFixed(1)}s;--dx:${(R()*80-40).toFixed(0)}px`;
    sky.appendChild(s); } })();
</script>
<script>
(() => {
const $ = s => document.querySelector(s), sb = window.sb;
/* Vérification anti-robot (Cloudflare Turnstile) avant chaque connexion */
const TS_KEY='0x4AAAAAAGGvQ_4r6Vma3LR3'; let tsToken='', tsId=null;
window.onTsLoad=()=>tsRender();
function tsRender(){ if(!window.turnstile||tsId!==null||!document.getElementById('ts')) return;
  tsId=window.turnstile.render('#ts',{sitekey:TS_KEY,language:'fr',appearance:'interaction-only',callback:t=>{tsToken=t;},'expired-callback':()=>{tsToken='';},'error-callback':()=>{tsToken='';}}); }
function tsReset(){ tsToken=''; if(window.turnstile&&tsId!==null) window.turnstile.reset(tsId); }

const next = new URLSearchParams(location.search).get('next');
const safeNext = /^(watchlist|paris|monde)\.html$/.test(next || '') ? next : '';
function bar(id, txt, pct, left, right){ $('#p'+id).style.width = Math.round(pct*100) + '%'; $('#t'+id).innerHTML = `<span>${left}</span><span>${right}</span>`; }
async function loadProgress(){
  try{
    const rows=[]; for(let f=0;;f+=1000){ const {data,error}=await sb.from('items').select('data->v,data->>c').range(f,f+999); if(error) throw error; rows.push(...data); if(data.length<1000) break; }
    const up=rows.filter(r=>(r.c==='cine'||r.c==='stream')&&r.v!==true).length, all=rows.filter(r=>!((r.c==='cine'||r.c==='stream')&&r.v!==true));
    const seen=all.filter(r=>r.v===true).length, todo=all.length-seen;
    bar('wl','',all.length?seen/all.length:0,`<b>${todo}</b> à voir${up?` · ${up} à venir`:''}`,`${seen} vu${seen>1?'s':''}`);
  }catch(e){ $('#twl').textContent='Liste indisponible pour l’instant'; }
  try{
    const {data}=await sb.from('lists').select('id,summary');
    const m=Object.fromEntries((data||[]).map(r=>[r.id,r.summary||{}]));
    for(const [k,id] of [['paris','pa'],['monde','mo']]){ const s=m[k]||{}, d=s.done||0, t=s.total||0;
      if(t) bar(id,'',d/t,`<b>${d}</b> / ${t} faits`,`${Math.floor(d/t*100)} %`); else $('#t'+id).innerHTML='<span>Ouvre la page pour démarrer</span>'; }
  }catch(e){}
}
function show(session){
  const on=!!session;
  $('#auth').hidden=on; $('#grid').hidden=!on; $('#foot').hidden=!on; if(!on){ tsRender(); document.querySelectorAll('[data-nm]').forEach(e=>e.textContent=''); }
  if(on){ if(safeNext){ location.replace(safeNext); return; } $('#who').textContent='Connecté : '+(session.user.email||''); loadProgress(); loadNames(sb); }
}
if(!sb){ document.body.insertAdjacentHTML('beforeend','<p>Impossible de charger le service (connexion internet ?).</p>'); return; }
sb.auth.onAuthStateChange((ev,session)=>show(session));
$('#auth').onsubmit=async e=>{
  e.preventDefault(); $('#aErr').textContent='';
  if(!tsToken){ tsRender(); $('#aErr').textContent='Vérification anti-robot en cours, réessaie dans 2 secondes.'; return; }
  $('#aGo').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('#aEmail').value.trim().toLowerCase(),password:$('#aPass').value,options:{captchaToken:tsToken}});
  $('#aGo').disabled=false; tsReset();
  if(error) $('#aErr').textContent=/Invalid login/i.test(error.message||'')?'E-mail ou mot de passe incorrect.':/captcha/i.test(error.message||'')?'La vérification anti-robot a échoué, réessaie.':'Ça n’a pas marché : '+error.message;
};
$('#logout').onclick=async()=>{ await sb.auth.signOut(); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&!$('#grid').hidden) loadProgress(); });
})();
</script>
